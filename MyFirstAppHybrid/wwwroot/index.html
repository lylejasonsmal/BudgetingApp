<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MyFirstAppHybrid</title>
    <base href="/" />

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="MyFirstAppHybrid.styles.css" />
    <link rel="stylesheet" href="css/MyFirstAppComponentLibrary.styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <link rel="icon" href="data:,">
</head>
<body>
<div class="status-bar-safe-area"></div>
<div id="app" class="page" style="justify-content: center; align-items:center;"><h1>Welcome</h1></div>
<script src="_framework/blazor.webview.js" autostart="false"></script>
<script>
    (function () {
        const savedTheme = localStorage.getItem("app-theme");
        const theme = savedTheme || "dark-theme";

        document.body.classList.remove("light-theme", "dark-theme");
        document.body.classList.add(theme);

        const savedFont = localStorage.getItem("app-font");
        const font = savedFont || "default-font";

        document.body.classList.remove("default-font", "secondary-font", "tertiary-font");
        document.body.classList.add(font);
    })();

    window.setTheme = function (theme) {
        document.body.classList.remove("light-theme", "dark-theme");
        document.body.classList.add(theme);
        localStorage.setItem("app-theme", theme);
    };

    window.getSavedTheme = function () {
        return localStorage.getItem("app-theme");
    };

    window.setFont = function (font) {
        document.body.classList.remove("default-font", "secondary-font", "tertiary-font", "quaternary-font");
        document.body.classList.add(font);
        localStorage.setItem("app-font", font);
    };

    window.getSavedFont = function () {
        return localStorage.getItem("app-font");
    };

    window.setExperimentalTheme = function (themeClass) {
        document.body.classList.remove("experimental");

        if (themeClass && themeClass.trim() !== "") {
            document.body.classList.add(themeClass);
        }
    };

</script>
</body>
</html>
